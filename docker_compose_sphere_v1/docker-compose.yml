services:
  # ============================================================================
  # Infrastructure Layer
  # ============================================================================

  # Reverse Proxy / API Gateway
  nginx:
    build:
      context: ..
      dockerfile: docker_compose_sphere_v1/services/nginx/Dockerfile
    container_name: sphere-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - periphery
    networks:
      - sphere-network
    restart: unless-stopped

  # Cache Layer
  redis:
    image: redis:7-alpine
    container_name: sphere-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - sphere-network
    restart: unless-stopped

  # Reference DB (PostgreSQL + pgvector)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sphere-postgres
    environment:
      POSTGRES_USER: sphere_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sphere_dev_password}
      POSTGRES_DB: sphere_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sphere-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sphere_user -d sphere_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Projection DB (MinIO - S3 Compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: sphere-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sphere_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sphere_admin_password}
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - sphere-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================================================
  # Application Layer
  # ============================================================================

  # Periphery - Entry Point Layer
  periphery:
    build:
      context: ./services
      dockerfile: periphery/Dockerfile
    container_name: sphere-periphery
    environment:
      NODE_ENV: production
      PORT: "3001"
      WS_URL: ws://localhost:3001
      SPHERE_CONFIG: /app/sphere.config.json
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: sphere_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sphere_dev_password}
      POSTGRES_DB: sphere_db
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sphere_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sphere_admin_password}
    ports:
      - "3001:3001"
    volumes:
      - ./sphere.config.json:/app/sphere.config.json:ro
      - periphery-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - sphere-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================================
  # Agent Layer (activate with: docker-compose --profile agent up)
  # ============================================================================

  # Ollama - Local LLM inference server
  ollama:
    image: ollama/ollama:latest
    container_name: sphere-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - sphere-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    profiles:
      - agent

  # Phi Agent - Autonomous Sphere explorer (phi via ollama)
  # Scalable: docker compose --profile agent up --scale phi-agent=3
  phi-agent:
    image: phi-agent:latest
    build:
      context: ../phi-agent
      dockerfile: Dockerfile
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
      SPHERE_URL: http://periphery:3001
      SPHERE_WS: ws://periphery:3001
      LOADOUT: random
      DAEMON: "true"
      DAEMON_SLEEP_MS: "10000"
      RESPONSE: "false"
      DIGESTOR_URL: http://digestor:5000
    volumes:
      - ../phi-agent/data:/app/data
    depends_on:
      periphery:
        condition: service_healthy
      ollama:
        condition: service_healthy
      digestor:
        condition: service_healthy
    networks:
      - sphere-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    profiles:
      - agent

  # Digestor - Species memory metabolism + IO Gateway (Agent Cluster の窓口)
  digestor:
    build:
      context: ../digestor
      dockerfile: Dockerfile
    container_name: sphere-digestor
    environment:
      DATA_DIR: /app/data
      DIGEST_INTERVAL_MS: "${DIGEST_INTERVAL_MS:-10800000}"
      HALF_LIFE_HOURS: "${HALF_LIFE_HOURS:-72}"
      MIN_EVALS: "50"
      MIN_PER_SPECIES: "20"
      GATEWAY_PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - ../phi-agent/data:/app/data
    networks:
      - sphere-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - agent

  # Pool Service - External data intake gateway (LLM scoring + Weapon pipeline)
  pool-service:
    build:
      context: ../pool-service
      dockerfile: Dockerfile
    container_name: sphere-pool-service
    environment:
      SPHERE_URL: http://periphery:3001/sphere/contribute
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
      POOL_PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      periphery:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - sphere-network
    restart: unless-stopped
    profiles:
      - agent

  # Explorers - Sphere Perception UI (Gradio)
  explorers:
    build:
      context: ../explorers
      dockerfile: Dockerfile
    container_name: sphere-explorers
    environment:
      SPHERE_URL: http://periphery:3001
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "7860:7860"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../phi-agent/data:/app/data
    depends_on:
      periphery:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - sphere-network
    restart: unless-stopped
    profiles:
      - agent

# ============================================================================
# Networks
# ============================================================================
networks:
  sphere-network:
    driver: bridge
    name: sphere-network

# ============================================================================
# Volumes
# ============================================================================
volumes:
  redis-data:
    name: sphere-redis-data
  postgres-data:
    name: sphere-postgres-data
  minio-data:
    name: sphere-minio-data
  periphery-logs:
    name: sphere-periphery-logs
  ollama-models:
    name: sphere-ollama-models
